# Render Blueprint — creates the web service and a PostgreSQL database.
# In Render: New → Blueprint → pick kaguilardev/northline.
services:
  - type: web
    name: northline
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: northline-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"   # Render's internal connection; use "true" for an external hosted DB
      - key: SESSION_SECRET
        generateValue: true
      - key: BUSINESS_NAME
        value: Northline Landscaping
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: northline-db
    plan: free
    databaseName: northline
